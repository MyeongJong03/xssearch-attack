name: Impression CTF probe
on:
  push:
    branches:
      - ctf/impression-probe-20261121
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Queue reviewer when available
        shell: bash
        run: |
          url='https://htmlpreview.github.io/?https://raw.githubusercontent.com/MyeongJong03/xssearch-attack/ctf/impression-probe-20261121/probe2.html#run=1'
          for attempt in {1..30}; do
            status=$(curl --silent --show-error --max-time 10 --output response.txt --write-out '%{http_code}' --data-urlencode "url=$url" 'http://172.237.8.236:24457/report')
            printf 'attempt=%d status=%s body=' "$attempt" "$status"
            cat response.txt
            printf '\n'
            if [ "$status" = 202 ]; then exit 0; fi
            sleep 10
          done
          exit 1
